<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>عيادة سمايل كير لطب الأسنان | Smile Care Dental Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --cream:#FAF6EF;
  --white:#FFFFFF;
  --beige:#F0E4D3;
  --beige-dark:#E3D0B0;
  --brown:#6F4E37;
  --brown-dark:#43301F;
  --brown-light:#A9784F;
  --gold:#C79A56;
  --text-dark:#3B2A1F;
  --text-muted:#8A7566;
  --success:#4C7A5A;
  --success-bg:#E7EFE7;
  --danger:#B5533C;
  --danger-bg:#F6E7E1;
  --pending-bg:#F3E9D2;
  --pending:#96702A;
  --font-display:'Cairo',sans-serif;
  --font-body:'Tajawal',sans-serif;
  --shadow-sm:0 2px 10px rgba(67,48,31,0.06);
  --shadow-md:0 10px 30px rgba(67,48,31,0.10);
  --shadow-lg:0 20px 45px rgba(67,48,31,0.14);
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--text-dark);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:var(--font-display);}
a{text-decoration:none;color:inherit;}
button{font-family:var(--font-body);cursor:pointer;}
img{max-width:100%;display:block;}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
.section{padding:88px 0;}
.section-tight{padding:56px 0;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;letter-spacing:.3px;
  color:var(--brown);background:var(--beige);
  padding:7px 16px;border-radius:999px;margin-bottom:16px;
}
.section-title{font-size:34px;font-weight:800;color:var(--brown-dark);margin:0 0 12px;line-height:1.3;}
.section-sub{font-size:16px;color:var(--text-muted);max-width:620px;margin:0 0 44px;line-height:1.9;}
.center{text-align:center;margin-inline:auto;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 28px;border-radius:999px;font-weight:700;font-size:15px;
  border:1px solid transparent;transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brown);color:var(--white);box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--brown-dark);box-shadow:var(--shadow-md);}
.btn-outline{background:transparent;color:var(--brown-dark);border-color:var(--beige-dark);}
.btn-outline:hover{background:var(--beige);}
.btn-ghost{background:transparent;color:var(--brown-dark);}
.btn-ghost:hover{background:var(--beige);}
.btn-sm{padding:9px 18px;font-size:13px;}
.btn-block{width:100%;}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{background:#efd6cb;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Navbar */
.navbar{
  position:sticky;top:0;z-index:50;
  background:rgba(250,246,239,0.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--beige);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1180px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--brown-dark);}
.logo-mark{
  width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--brown),var(--brown-light));
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow-sm);
}
.nav-links{display:flex;align-items:center;gap:30px;}
.nav-link{font-weight:600;font-size:15px;color:var(--text-dark);opacity:.85;padding:6px 2px;border-bottom:2px solid transparent;transition:.2s;}
.nav-link:hover{opacity:1;color:var(--brown);}
.nav-actions{display:flex;align-items:center;gap:12px;}
.nav-toggle{display:none;background:none;border:none;padding:8px;}
.user-chip{
  display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--beige-dark);
  padding:6px 8px 6px 16px;border-radius:999px;box-shadow:var(--shadow-sm);
}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--beige);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brown-dark);font-size:13px;}

/* Hero */
.hero{position:relative;overflow:hidden;padding:70px 0 40px;}
.hero-inner{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--beige-dark);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--brown);box-shadow:var(--shadow-sm);margin-bottom:22px;}
.hero h1{font-size:52px;line-height:1.25;font-weight:900;color:var(--brown-dark);margin:0 0 22px;}
.hero h1 span{color:var(--brown);position:relative;}
.hero p.lead{font-size:18px;color:var(--text-muted);line-height:1.9;margin:0 0 34px;max-width:520px;}
.hero-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:40px;}
.hero-stats{display:flex;gap:34px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--brown-dark);}
.hero-stat span{font-size:13px;color:var(--text-muted);}
.hero-media{position:relative;}
.hero-media-frame{
  position:relative;border-radius:32px;overflow:hidden;box-shadow:var(--shadow-lg);
  aspect-ratio:4/5;background:var(--beige);
}
.hero-media-frame img{width:100%;height:100%;object-fit:cover;}
.hero-floating-card{
  position:absolute;background:var(--white);border-radius:18px;box-shadow:var(--shadow-md);
  padding:14px 18px;display:flex;align-items:center;gap:12px;
}
.hero-floating-1{top:24px;left:-18px;}
.hero-floating-2{bottom:26px;right:-22px;}
.icon-badge{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;z-index:-1;}

/* Services */
.services-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
.service-card{
  background:var(--white);border-radius:var(--radius-md);padding:30px 24px;box-shadow:var(--shadow-sm);
  border:1px solid rgba(227,208,176,0.5);transition:.25s;
}
.service-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-md);border-color:var(--beige-dark);}
.service-icon{width:56px;height:56px;border-radius:16px;background:var(--beige);display:flex;align-items:center;justify-content:center;margin-bottom:20px;color:var(--brown);}
.service-card h3{font-size:18px;margin:0 0 8px;color:var(--brown-dark);}
.service-card p{font-size:14px;color:var(--text-muted);line-height:1.8;margin:0;}

/* Doctors */
.doctors-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
.doctor-card{background:var(--white);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid rgba(227,208,176,0.5);transition:.25s;}
.doctor-card:hover{box-shadow:var(--shadow-md);transform:translateY(-4px);}
.doctor-photo{aspect-ratio:1/1;overflow:hidden;background:var(--beige);}
.doctor-photo img{width:100%;height:100%;object-fit:cover;}
.doctor-body{padding:22px 22px 26px;}
.doctor-body h3{margin:0 0 4px;font-size:19px;color:var(--brown-dark);}
.doctor-spec{color:var(--brown);font-weight:700;font-size:13px;margin-bottom:12px;}
.doctor-meta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:16px;}
.stars{display:inline-flex;gap:2px;color:var(--gold);}

/* Reviews */
.reviews-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.review-card{background:var(--white);border-radius:var(--radius-md);padding:26px;box-shadow:var(--shadow-sm);border:1px solid rgba(227,208,176,0.5);}
.review-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.review-avatar{width:44px;height:44px;border-radius:50%;background:var(--beige);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brown-dark);}
.review-name{font-weight:700;color:var(--brown-dark);font-size:15px;}
.review-text{font-size:14px;color:var(--text-muted);line-height:1.85;margin:0;}

/* Cards generic */
.card{background:var(--white);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border:1px solid rgba(227,208,176,0.5);}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;}
.pill-confirmed{background:var(--success-bg);color:var(--success);}
.pill-pending{background:var(--pending-bg);color:var(--pending);}
.pill-cancelled{background:var(--danger-bg);color:var(--danger);}
.pill-completed{background:var(--beige);color:var(--brown-dark);}

/* About */
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center;}
.about-media{border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:4/3.4;}
.about-media img{width:100%;height:100%;object-fit:cover;}
.about-points{display:grid;gap:18px;margin-top:26px;}
.about-point{display:flex;gap:14px;align-items:flex-start;}
.about-point .icon-badge{background:var(--beige);color:var(--brown);}
.about-point h4{margin:0 0 4px;font-size:16px;color:var(--brown-dark);}
.about-point p{margin:0;font-size:14px;color:var(--text-muted);line-height:1.8;}

/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;}
.contact-card{padding:28px;display:flex;gap:16px;align-items:flex-start;}
.contact-card h4{margin:0 0 6px;font-size:16px;color:var(--brown-dark);}
.contact-card p{margin:0;font-size:14px;color:var(--text-muted);line-height:1.8;}

/* Footer */
.footer{background:var(--brown-dark);color:#EDE1D2;padding:64px 0 26px;margin-top:40px;}
.footer-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:40px;margin-bottom:44px;}
.footer h4{font-size:16px;margin:0 0 18px;color:#fff;}
.footer p, .footer a{font-size:14px;color:#D9C7AE;line-height:2.1;}
.footer a:hover{color:#fff;}
.footer-logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:19px;color:#fff;margin-bottom:14px;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.12);padding-top:22px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#C7B39A;flex-wrap:wrap;gap:12px;}
.social-row{display:flex;gap:10px;}
.social-btn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:#fff;transition:.2s;}
.social-btn:hover{background:var(--brown-light);}
.footer-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;}

/* Auth pages */
.auth-wrap{min-height:calc(100vh - 78px);display:flex;align-items:center;justify-content:center;padding:60px 20px;background:radial-gradient(circle at 20% 20%, var(--beige) 0%, var(--cream) 55%);}
.auth-card{width:100%;max-width:440px;background:var(--white);border-radius:28px;box-shadow:var(--shadow-lg);padding:42px 38px;border:1px solid var(--beige);}
.auth-icon{width:56px;height:56px;border-radius:16px;background:var(--beige);display:flex;align-items:center;justify-content:center;color:var(--brown);margin-bottom:20px;}
.auth-card h2{margin:0 0 8px;font-size:26px;color:var(--brown-dark);}
.auth-card p.sub{margin:0 0 28px;color:var(--text-muted);font-size:14px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--brown-dark);margin-bottom:8px;}
.field input, .field select, .field textarea{
  width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--beige-dark);
  background:var(--cream);font-family:var(--font-body);font-size:14px;color:var(--text-dark);transition:.2s;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--brown-light);background:var(--white);box-shadow:0 0 0 4px rgba(169,120,79,0.12);}
.role-toggle{display:flex;gap:10px;margin-bottom:22px;}
.role-opt{flex:1;text-align:center;padding:12px;border-radius:14px;border:1.5px solid var(--beige-dark);font-weight:700;font-size:13px;color:var(--text-muted);}
.role-opt.active{border-color:var(--brown);background:var(--beige);color:var(--brown-dark);}
.auth-foot{text-align:center;margin-top:22px;font-size:14px;color:var(--text-muted);}
.auth-foot a{color:var(--brown);font-weight:700;}
.demo-box{background:var(--beige);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--brown-dark);line-height:1.9;margin-top:20px;}
.error-box{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;}
.success-box{background:var(--success-bg);color:var(--success);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;}

/* Dashboard */
.dash-shell{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 78px);}
.dash-side{background:var(--white);border-left:1px solid var(--beige);padding:30px 20px;}
.dash-profile{display:flex;align-items:center;gap:12px;padding:10px 8px 24px;border-bottom:1px solid var(--beige);margin-bottom:18px;}
.dash-profile .avatar{width:46px;height:46px;font-size:16px;background:var(--brown);color:#fff;}
.dash-nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:600;font-size:14.5px;
  color:var(--text-dark);margin-bottom:6px;transition:.2s;
}
.dash-nav-item:hover{background:var(--beige);}
.dash-nav-item.active{background:var(--brown);color:#fff;}
.dash-main{padding:36px 40px;}
.dash-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px;flex-wrap:wrap;gap:14px;}
.dash-header h2{margin:0 0 6px;font-size:26px;color:var(--brown-dark);}
.dash-header p{margin:0;color:var(--text-muted);font-size:14px;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:30px;}
.stat-card{padding:22px;display:flex;align-items:center;gap:14px;}
.stat-card b{display:block;font-family:var(--font-display);font-size:24px;color:var(--brown-dark);}
.stat-card span{font-size:12.5px;color:var(--text-muted);}

.appt-card{padding:20px 22px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:16px;flex-wrap:wrap;}
.appt-left{display:flex;gap:16px;align-items:center;}
.appt-date-box{width:60px;height:60px;border-radius:14px;background:var(--beige);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.appt-date-box b{font-size:19px;color:var(--brown-dark);font-family:var(--font-display);}
.appt-date-box span{font-size:11px;color:var(--brown);}
.appt-info h4{margin:0 0 4px;font-size:15.5px;color:var(--brown-dark);}
.appt-info p{margin:0;font-size:13px;color:var(--text-muted);}
.appt-right{display:flex;align-items:center;gap:12px;}

.booking-steps{display:flex;align-items:center;gap:8px;margin-bottom:34px;flex-wrap:wrap;}
.step-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-muted);padding:8px 6px;}
.step-chip .num{width:26px;height:26px;border-radius:50%;background:var(--beige);color:var(--brown-dark);display:flex;align-items:center;justify-content:center;font-size:12px;}
.step-chip.active{color:var(--brown-dark);}
.step-chip.active .num{background:var(--brown);color:#fff;}
.step-sep{width:26px;height:1.5px;background:var(--beige-dark);}

.pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.pick-card{
  border:1.5px solid var(--beige-dark);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;
  background:var(--white);transition:.18s;text-align:right;width:100%;
}
.pick-card:hover{border-color:var(--brown-light);}
.pick-card.selected{border-color:var(--brown);background:var(--beige);box-shadow:var(--shadow-sm);}
.pick-card img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;}
.pick-card .service-icon{margin-bottom:0;width:48px;height:48px;}
.pick-name{font-weight:700;font-size:14.5px;color:var(--brown-dark);}
.pick-sub{font-size:12px;color:var(--text-muted);}

.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.slot-btn{padding:11px 6px;border-radius:12px;border:1.5px solid var(--beige-dark);background:var(--white);font-weight:700;font-size:13px;color:var(--text-dark);}
.slot-btn.selected{background:var(--brown);color:#fff;border-color:var(--brown);}
.slot-btn:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed;}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state .icon-badge{margin:0 auto 18px;width:64px;height:64px;background:var(--beige);color:var(--brown);}

.mobile-menu{display:none;}

@media(max-width:980px){
  .hero-inner{grid-template-columns:1fr;}
  .hero-media{order:-1;max-width:420px;margin:0 auto;}
  .hero h1{font-size:38px;}
  .services-grid{grid-template-columns:repeat(2,1fr);}
  .doctors-grid{grid-template-columns:repeat(2,1fr);}
  .reviews-grid{grid-template-columns:1fr;}
  .about-grid{grid-template-columns:1fr;}
  .contact-grid{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr 1fr;}
  .dash-shell{grid-template-columns:1fr;}
  .dash-side{display:none;}
  .dash-side.open{display:block;}
  .stat-row{grid-template-columns:1fr 1fr;}
  .nav-links{display:none;}
  .nav-toggle{display:flex;}
  .pick-grid{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .services-grid{grid-template-columns:1fr;}
  .doctors-grid{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:1fr 1fr;}
  .slot-grid{grid-template-columns:repeat(2,1fr);}
  .hero h1{font-size:30px;}
  .dash-main{padding:24px 18px;}
  .section{padding:56px 0;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;

/* ---------------- Icons (inline SVG, stroke-based, warm & minimal) ---------------- */
const Icon = ({name, size=20, color="currentColor"}) => {
  const p = {width:size, height:size, viewBox:"0 0 24 24", fill:"none", stroke:color, strokeWidth:1.8, strokeLinecap:"round", strokeLinejoin:"round"};
  switch(name){
    case "tooth": return <svg {...p}><path d="M12 2c-2 0-3 1.2-4 1.2S6 2 4.5 2C2.5 2 1 4 1.5 7c.5 3 1.5 4 1.8 7 .3 2.7 1 6 2.7 6 1.5 0 1.3-3.5 2-5.5.4-1.1.8-1.5 1.5-1.5s1.1.4 1.5 1.5c.7 2 .5 5.5 2 5.5 1.7 0 2.4-3.3 2.7-6 .3-3 1.3-4 1.8-7C22 4 20.5 2 18.5 2 17 2 16 3.2 15 3.2 14 3.2 13 2 12 2 12 2z"/></svg>;
    case "sparkle-tooth": return <svg {...p}><path d="M9 2c-1.5 0-2.3 1-3 1s-1.7-1-3-1C1.3 2 .5 3.5 1 5.5c.4 2 1 2.7 1.3 5 .2 2 .8 4.5 2 4.5 1.1 0 1-2.5 1.5-4 .3-.9.6-1.1 1.2-1.1"/><path d="M19 12l.9 2.1L22 15l-2.1.9L19 18l-.9-2.1L16 15l2.1-.9L19 12z"/><path d="M15 3l.6 1.4L17 5l-1.4.6L15 7l-.6-1.4L13 5l1.4-.6L15 3z"/></svg>;

function futureDate(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}
function pastDate(days){const d=new Date();d.setDate(d.getDate()-days);return d.toISOString().slice(0,10);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  return {day: d.getDate(), month: months[d.getMonth()], full: `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`};
}
function serviceById(id){return SERVICES.find(s=>s.id===id);}
function doctorById(id){return DOCTORS.find(d=>d.id===id);}
function initials(name){return (name||"?").trim().split(" ").slice(0,2).map(w=>w[0]).join("");}

function Stars({rating, size=14}){
  const full = Math.round(rating);
  return (
    <span className="stars">
      {[1,2,3,4,5].map(i=> <Icon key={i} name="star" size={size} color={i<=full? "var(--gold)":"#E6D8C3"} />)}
    </span>
  );
}
function StatusPill({status}){
  const map = {
    confirmed:{cls:"pill-confirmed", label:"مؤكد", icon:"check-circle"},
    pending:{cls:"pill-pending", label:"قيد المراجعة", icon:"clock"},
    cancelled:{cls:"pill-cancelled", label:"ملغي", icon:"x-circle"},
    completed:{cls:"pill-completed", label:"مكتمل", icon:"check"},
  };
  const m = map[status] || map.pending;
  return <span className={`pill ${m.cls}`}><Icon name={m.icon} size={13}/>{m.label}</span>;
}

function RegisterPage({setPage, users, onRegister}){
  const [form, setForm] = useState({name:"", email:"", phone:"", password:"", confirm:""});
  const [error, setError] = useState("");
  const upd = (k,v) => setForm({...form, [k]:v});

  const submit = (e) => {
    e.preventDefault();
    if(!form.name || !form.email || !form.password) { setError("من فضلك أكمل كل الحقول المطلوبة."); return; }
    if(form.password.length < 6){ setError("كلمة المرور يجب ألا تقل عن 6 أحرف."); return; }
    if(form.password !== form.confirm){ setError("كلمتا المرور غير متطابقتين."); return; }
    if(users.some(u=>u.email.toLowerCase()===form.email.toLowerCase())){ setError("هذا البريد الإلكتروني مستخدم بالفعل."); return; }
    setError("");
    onRegister({id:"u"+Date.now(), name:form.name, email:form.email, phone:form.phone, password:form.password, role:"patient"});
  };

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <span className="auth-icon"><Icon name="user" size={26}/></span>
        <h2>إنشاء حساب جديد</h2>

        <form onSubmit={submit}>
          <div className="field">
            <label>الاسم الكامل</label>
            <input required value={form.name} onChange={e=>upd("name", e.target.value)} placeholder="اكتب اسمك بالكامل"/>
          </div>
          <div className="field">
            <label>البريد الإلكتروني</label>
            <input type="email" required value={form.email} onChange={e=>upd("email", e.target.value)} placeholder="example@email.com"/>
          </div>
          <div className="field">
            <label>رقم الهاتف</label>
            <input value={form.phone} onChange={e=>upd("phone", e.target.value)} placeholder="01xxxxxxxxx"/>
          </div>
          <div className="field">
            <label>كلمة المرور</label>
            <input type="password" required value={form.password} onChange={e=>upd("password", e.target.value)} placeholder="6 أحرف على الأقل"/>
          </div>
          <div className="field">
            <label>تأكيد كلمة المرور</label>
            <input type="password" required value={form.confirm} onChange={e=>upd("confirm", e.target.value)} placeholder="أعد كتابة كلمة المرور"/>
          </div>
          <button className="btn btn-primary btn-block" type="submit">إنشاء الحساب</button>
        </form>
        <p className="auth-foot">لديك حساب بالفعل؟ <a href="#" onClick={(e)=>{e.preventDefault(); setPage("login");}}>تسجيل الدخول</a></p>

  );
}

/* ---------------- Patient: Book appointment ---------------- */
function BookAppointment({user, addAppointment, setTab}){
  const [step, setStep] = useState(1);
  const [doctorId, setDoctorId] = useState(null);
  const [serviceId, setServiceId] = useState(null);
  const [date, setDate] = useState("");
  const [time, setTime] = useState(null);
  const [done, setDone] = useState(false);

  const bookedSlots = useMemo(()=>{
    if(!doctorId || !date) return [];
    // deterministic pseudo-random "taken" slots based on doctor+date
    const seed = (doctorId+date).split("").reduce((a,c)=>a+c.charCodeAt(0),0);
    return TIME_SLOTS.filter((_,i)=> (seed+i*7) % 5 === 0);
  }, [doctorId, date]);

  const canNext1 = !!doctorId;
  const canNext2 = !!serviceId;
  const canNext3 = !!date;
  const canConfirm = !!time;

  const confirm = () => {
    addAppointment({
      id:"a"+Date.now(), patientId:user.id, patientName:user.name,
      doctorId, serviceId, date, time, status:"pending"
    });
    setDone(true);

    return (

        <div style={{display:"flex", gap:12, justifyContent:"center"}}>

        </div>
      </div>
    );
  }

  const steps = [
    {n:1, label:"اختر الطبيب"},
    {n:2, label:"اختر الخدمة"},

          <div>
            <h3 style={{marginTop:0, color:"var(--brown-dark)"}}>اختر تاريخ الزيارة</h3>
            <div className="field" style={{maxWidth:280}}>
              <label>التاريخ</label>
              <input type="date" min={todayStr()} value={date} onChange={e=>{setDate(e.target.value); setTime(null);}}/>
            </div>
          </div>
        )}
        {step===4 && (
          <div>
            <h3 style={{marginTop:0, color:"var(--brown-dark)"}}>اختر الموعد المتاح</h3>
            <div className="slot-grid">
              {TIME_SLOTS.map(t => (
                <button key={t} disabled={bookedSlots.includes(t)} className={"slot-btn"+(time===t?" selected":"")} onClick={()=>setTime(t)}>{t}</button>
              ))}
            </div>
            <div className="card" style={{marginTop:22, padding:18, background:"var(--cream)"}}>
              <b style={{color:"var(--brown-dark)", fontSize:14}}>ملخص الحجز</b>
              <p style={{margin:"8px 0 0", fontSize:13.5, color:"var(--text-muted)", lineHeight:2}}>
                الطبيب: {doctorById(doctorId)?.name}<br/>
                الخدمة: {serviceById(serviceId)?.name}<br/>
                التاريخ: {date && fmtDate(date).full}<br/>
                الوقت: {time || "—"}
              </p>
            </div>
          </div>
        )}

        <div style={{display:"flex", justifyContent:"space-between", marginTop:28}}>
          <button className="btn btn-outline" disabled={step===1} onClick={()=>setStep(step-1)}>السابق</button>
          {step<4 ? (
            <button className="btn btn-primary" disabled={(step===1&&!canNext1)||(step===2&&!canNext2)||(step===3&&!canNext3)} onClick={()=>setStep(step+1)}>التالي</button>
          ) : (
            <button className="btn btn-primary" disabled={!canConfirm} onClick={confirm}><Icon name="check" size={16}/> تأكيد الحجز</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Patient: Appointments list ---------------- */
function PatientAppointments({user, appointments, cancelAppointment}){
  const [filter, setFilter] = useState("upcoming");
  const mine = appointments.filter(a=>a.patientId===user.id);
  const upcoming = mine.filter(a=> a.date>=todayStr() && a.status!=="cancelled").sort((a,b)=>a.date.localeCompare(b.date));
  const previous = mine.filter(a=> a.date<todayStr() || a.status==="cancelled").sort((a,b)=>b.date.localeCompare(a.date));
  const list = filter==="upcoming"? upcoming : previous;
  return (
    <div>
      <div className="dash-header"><div><h2>مواعيدي</h2><p>تابع حالة حجوزاتك السابقة والقادمة.</p></div></div>
      <div style={{display:"flex", gap:10, marginBottom:22}}>
        <button className={"btn btn-sm "+(filter==="upcoming"?"btn-primary":"btn-outline")} onClick={()=>setFilter("upcoming")}>القادمة ({upcoming.length})</button>
        <button className={"btn btn-sm "+(filter==="previous"?"btn-primary":"btn-outline")} onClick={()=>setFilter("previous")}>السابقة ({previous.length})</button>
      </div>
      {list.length===0 ? (
        <div className="card empty-state">
          <span className="icon-badge"><Icon name="calendar" size={26}/></span>
          <p>لا توجد مواعيد {filter==="upcoming"?"قادمة":"سابقة"} حاليًا.</p>
        </div>
      ) : list.map(a => <AppointmentCard key={a.id} appt={a} onCancel={cancelAppointment}/>)}
    </div>
  );
}

/* ---------------- Profile (shared) ---------------- */
function ProfilePage({user, updateUser}){
  const [form, setForm] = useState({name:user.name, email:user.email, phone:user.phone||""});
  const [saved, setSaved] = useState(false);
  const submit = (e) => {
    e.preventDefault();
    updateUser({...user, ...form});
    setSaved(true);
    setTimeout(()=>setSaved(false), 2500);
  };
  return (
    <div>
      <div className="dash-header"><div><h2>الملف الشخصي</h2><p>يمكنك تعديل بياناتك الشخصية هنا.</p></div></div>
      <div className="card" style={{padding:28, maxWidth:520}}>
        {saved && <div className="success-box">تم حفظ التعديلات بنجاح.</div>}
        <form onSubmit={submit}>
          <div className="field"><label>الاسم الكامل</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div>
          <div className="field"><label>البريد الإلكتروني</label><input type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/></div>
          <div className="field"><label>رقم الهاتف</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/></div>
          <button className="btn btn-primary" type="submit"><Icon name="check" size={16}/> حفظ التعديلات</button>
        </form>
      </div>
    </div>
  );
}

/* ---------------- Doctor dashboard ---------------- */
function DoctorOverview({user, appointments}){
  const mine = appointments.filter(a=>a.doctorId==="d1" || doctorById(a.doctorId)?.name===user.name);
  const today = mine.filter(a=>a.date===todayStr());
  const upcoming = mine.filter(a=>a.date>=todayStr());
  return (
    <div>
      <div className="dash-header"><div><h2>أهلاً، {user.name} 👋</h2><p>نظرة عامة على مواعيد اليوم والمرضى.</p></div></div>
      <div className="stat-row">
        <div className="card stat-card"><span className="icon-badge" style={{background:"var(--beige)", color:"var(--brown)"}}><Icon name="calendar" size={20}/></span><div><b>{today.length}</b><span>مواعيد اليوم</span></div></div>
        <div className="card stat-card"><span className="icon-badge" style={{background:"var(--success-bg)", color:"var(--success)"}}><Icon name="users" size={20}/></span><div><b>{upcoming.length}</b><span>مواعيد قادمة</span></div></div>
        <div className="card stat-card"><span className="icon-badge" style={{background:"var(--pending-bg)", color:"var(--pending)"}}><Icon name="clock" size={20}/></span><div><b>{mine.filter(a=>a.status==="pending").length}</b><span>بانتظار التأكيد</span></div></div>
        <div className="card stat-card"><span className="icon-badge" style={{background:"var(--beige)", color:"var(--brown)"}}><Icon name="star" size={20}/></span><div><b>4.9</b><span>تقييم المرضى</span></div></div>
      </div>
      <h3 style={{fontSize:17, color:"var(--brown-dark)", marginBottom:14}}>مواعيد اليوم</h3>
      {today.length===0 ? <div className="card empty-state"><p>لا توجد مواعيد اليوم.</p></div> : today.map(a=><AppointmentCard key={a.id} appt={a} readOnly/>)}
    </div>
  );
}
function DoctorAppointments({user, appointments, setStatus}){
  const mine = appointments.filter(a=>doctorById(a.doctorId)?.name===user.name || a.doctorId==="d1").sort((a,b)=>a.date.localeCompare(b.date));
  return (
    <div>
      <div className="dash-header"><div><h2>مواعيد المرضى</h2><p>راجع وأدر حالة المواعيد المرتبطة بك.</p></div></div>
      {mine.length===0 ? <div className="card empty-state"><p>لا توجد مواعيد.</p></div> : mine.map(a => (
        <div className="card appt-card" key={a.id}>
          <div className="appt-left">
            <div className="appt-date-box"><b>{fmtDate(a.date).day}</b><span>{fmtDate(a.date).month}</span></div>
            <div className="appt-info"><h4>{a.patientName} — {serviceById(a.serviceId)?.name}</h4><p><Icon name="clock" size={13}/> {a.time}</p></div>
          </div>
          <div className="appt-right">
            <StatusPill status={a.status}/>
            {a.status==="pending" && <button className="btn btn-primary btn-sm" onClick={()=>setStatus(a.id,"confirmed")}>تأكيد</button>}
            {a.status!=="cancelled" && a.status!=="completed" && <button className="btn btn-danger btn-sm" onClick={()=>setStatus(a.id,"cancelled")}>إلغاء</button>}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------- Admin dashboard ---------------- */
function AdminOverview({appointments, users}){
  return (
    <div>
      <div className="dash-header"><div><h2>لوحة تحكم المدير</h2><p>نظرة عامة على أداء العيادة.</p></div></div>
      <div className="stat-row">
        <div className="card stat-card"><span className="icon-badge" style={{background:"var(--beige)", color:"var(--brown)"}}><Icon name="calendar" size={20}/></span><div><b>{appointments.length}</b><span>إجمالي المواعيد</span></div></div>
        <div className="card stat-card"><span className="icon-badge" style={{background:"var(--success-bg)", color:"var(--success)"}}><Icon name="users" size={20}/></span><div><b>{users.filter(u=>u.role==="patient").length}</b><span>عدد المرضى</span></div></div>
        <div className="card stat-card"><span className="icon-badge" style={{background:"var(--beige)", color:"var(--brown)"}}><Icon name="user" size={20}/></span><div><b>{DOCTORS.length}</b><span>عدد الأطباء</span></div></div>
        <div className="card stat-card"><span className="icon-badge" style={{background:"var(--pending-bg)", color:"var(--pending)"}}><Icon name="clock" size={20}/></span><div><b>{appointments.filter(a=>a.status==="pending").length}</b><span>بانتظار التأكيد</span></div></div>
      </div>
    </div>
  );
}
function AdminAppointments({appointments}){
  const sorted = [...appointments].sort((a,b)=>b.date.localeCompare(a.date));
  return (
    <div>
      <div className="dash-header"><div><h2>كل المواعيد</h2><p>عرض جميع الحجوزات في العيادة.</p></div></div>
      {sorted.map(a => (
        <div className="card appt-card" key={a.id}>
          <div className="appt-left">
            <div className="appt-date-box"><b>{fmtDate(a.date).day}</b><span>{fmtDate(a.date).month}</span></div>
            <div className="appt-info"><h4>{a.patientName} — {doctorById(a.doctorId)?.name}</h4><p>{serviceById(a.serviceId)?.name} • {a.time}</p></div>
          </div>
          <StatusPill status={a.status}/>
        </div>
      ))}
    </div>
  );
}
function AdminUsers({users}){
  return (
    <div>
      <div className="dash-header"><div><h2>المستخدمون</h2><p>إدارة حسابات المرضى والأطباء والمديرين.</p></div></div>
      <div className="card" style={{padding:0, overflow:"hidden"}}>
        {users.map((u,i) => (
          <div key={u.id} style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"16px 22px", borderBottom: i<users.length-1?"1px solid var(--beige)":"none"}}>
            <div style={{display:"flex", alignItems:"center", gap:12}}>
              <span className="avatar">{initials(u.name)}</span>
              <div><div style={{fontWeight:700, fontSize:14, color:"var(--brown-dark)"}}>{u.name}</div><div style={{fontSize:12.5, color:"var(--text-muted)"}}>{u.email}</div></div>
            </div>
            <span className="pill pill-completed">{u.role==="patient"?"مريض":u.role==="doctor"?"طبيب":"مدير"}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- Dashboard root ---------------- */
function Dashboard({user, appointments, addAppointment, cancelAppointment, setStatus, updateUser, users}){
  const [tab, setTab] = useState("overview");
  const [mobileOpen, setMobileOpen] = useState(false);

  let content;
  if(user.role==="patient"){
    if(tab==="overview") content = <PatientOverview user={user} appointments={appointments} setTab={setTab}/>;
    else if(tab==="book") content = <BookAppointment user={user} addAppointment={addAppointment} setTab={setTab}/>;
    else if(tab==="appointments") content = <PatientAppointments user={user} appointments={appointments} cancelAppointment={cancelAppointment}/>;
    else if(tab==="profile") content = <ProfilePage user={user} updateUser={updateUser}/>;
  } else if(user.role==="doctor"){
    if(tab==="overview") content = <DoctorOverview user={user} appointments={appointments}/>;
    else if(tab==="appointments") content = <DoctorAppointments user={user} appointments={appointments} setStatus={setStatus}/>;
    else if(tab==="profile") content = <ProfilePage user={user} updateUser={updateUser}/>;
  } else {
    if(tab==="overview") content = <AdminOverview appointments={appointments} users={users}/>;
    else if(tab==="appointments") content = <AdminAppointments appointments={appointments}/>;
    else if(tab==="users") content = <AdminUsers users={users}/>;
  }

  return (
    <div className="dash-shell">
      <DashSide user={user} tab={tab} setTab={(t)=>{setTab(t); setMobileOpen(false);}} onLogout={()=>window.__logout()} mobileOpen={mobileOpen}/>
      <main className="dash-main">
        <button className="btn btn-outline btn-sm" style={{marginBottom:18, display: window.innerWidth<=980?"inline-flex":"none"}} onClick={()=>setMobileOpen(!mobileOpen)}>
          <Icon name="menu" size={16}/> القائمة
        </button>
        {content}
      </main>
    </div>
  );
}

/* ---------------- App root ---------------- */
function App(){
  const [page, setPage] = useState("home");
  const [users, setUsers] = useState(SEED_USERS);
  const [user, setUser] = useState(null);
  const [appointments, setAppointments] = useState(SEED_APPOINTMENTS);
  const [reviews, setReviews] = useState(INITIAL_REVIEWS);

  const scrollTo = (id) => { if(window.__scrollTo) window.__scrollTo(id); else { const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:"smooth"}); } };

  const onLogin = (u) => { setUser(u); setPage("dashboard"); window.scrollTo(0,0); };
  const onRegister = (u) => { setUsers([...users, u]); setUser(u); setPage("dashboard"); window.scrollTo(0,0); };
  const onLogout = () => { setUser(null); setPage("home"); window.scrollTo(0,0); };
  window.__logout = onLogout;

  const addAppointment = (a) => setAppointments([a, ...appointments]);
  const cancelAppointment = (id) => setAppointments(appointments.map(a => a.id===id? {...a, status:"cancelled"} : a));
  const setStatus = (id, status) => setAppointments(appointments.map(a=>a.id===id? {...a, status}: a));
  const updateUser = (u) => { setUsers(users.map(x=>x.id===u.id?u:x)); setUser(u); };
  const addReview = (r) => setReviews([r, ...reviews]);

  useEffect(()=>{ document.title = "عيادة سمايل كير لطب الأسنان"; }, []);

  return (
    <React.Fragment>
      <Navbar page={page} setPage={setPage} user={user} onLogout={onLogout} scrollTo={scrollTo}/>
      {page==="home" && <HomePage user={user} setPage={setPage} reviews={reviews} addReview={addReview}/>}
      {page==="login" && <LoginPage setPage={setPage} users={users} onLogin={onLogin}/>}
      {page==="register" && <RegisterPage setPage={setPage} users={users} onRegister={onRegister}/>}
      {page==="forgot" && <ForgotPasswordPage setPage={setPage}/>}
      {page==="dashboard" && user && (
        <Dashboard user={user} appointments={appointments} addAppointment={addAppointment}
          cancelAppointment={cancelAppointment} setStatus={setStatus} updateUser={updateUser} users={users}/>
      )}
      {page==="dashboard" && !user && (() => { setPage("login"); return null; })()}
      {page==="home" && <Footer scrollTo={scrollTo} setPage={setPage}/>}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
